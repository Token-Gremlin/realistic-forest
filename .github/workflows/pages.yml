# Build the Vite bundle and publish it to the gh-pages branch.
# Demo: https://token-gremlin.github.io/realistic-forest/
#
# After the first green run, turn Pages on once:
# Settings → Pages → Deploy from a branch → gh-pages / (root).
#
# Public README stills live in docs/screens/ and were taken on a discrete GPU.
# GitHub Actions is SwiftShader — do not commit those frames as the gallery.

name: Live demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Add Pages marker
        run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
